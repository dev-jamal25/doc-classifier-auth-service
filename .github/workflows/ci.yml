name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mypy app/ || true

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q || true

  golden-set:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLASSIFIER_TORCH_NUM_THREADS: "1"
      CLASSIFIER_TORCH_INTEROP_THREADS: "1"
      CLASSIFIER_ENABLE_MKLDNN: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS artifacts
        run: git lfs pull
        working-directory: .

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install classifier dependencies
        run: uv sync --frozen --all-extras

      - name: Verify classifier artifacts exist
        run: |
          test -f app/classifier/models/classifier.pt
          test -f app/classifier/models/model_card.json
          test -f app/classifier/eval/golden_expected.json
          test -d app/classifier/eval/golden_images

      - name: Verify classifier artifact contract
        run: |
          uv run python -c "from app.classifier.model import verify_artifacts; verify_artifacts(); print('classifier artifacts verified')"

      - name: Run golden-set replay
        run: uv run python -m app.classifier.eval.golden

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, golden-set]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS artifacts
        run: git lfs pull

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for API healthcheck
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "api ready"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "api did not come up"
          docker compose ps
          exit 1

      - name: Wait for worker and SFTP ingest startup
        run: |
          for pair in "worker worker_started" "sftp-ingest sftp_ingest_started"; do
            set -- $pair
            service="$1"
            event="$2"
            for i in {1..60}; do
              if docker compose logs --no-color "$service" | grep -q "$event"; then
                echo "$service ready: saw $event"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "$service did not emit $event"
                docker compose logs --no-color --tail=300 "$service" || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run smoke tests
        working-directory: backend
        env:
          RUN_COMPOSE_SMOKE: "1"
        run: uv run pytest tests/smoke -v -s

      - name: Dump all container logs on failure
        if: failure()
        run: |
          for svc in api worker sftp-ingest migrate vault-init minio-init db redis minio sftp vault; do
            echo "===== $svc ====="
            docker compose logs --no-color --tail=300 "$svc" || true
          done

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TODO: pending framework choice"'
