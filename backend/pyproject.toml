[project]
name = "doc-classifier"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "hvac>=2.4.0",
  "fastapi-users[sqlalchemy]>=15.0.5",
  "pycasbin>=2.8.0",
  "casbin-async-sqlalchemy-adapter>=1.17.0",
]

[project.optional-dependencies]
api = [
  "fastapi",
  "fastapi-cache2>=0.2.2",
  "jinja2>=3.1.6",
  "minio>=7.2.20",
  "redis>=7.4.0",
  "rq>=2.8.0",
  "uvicorn[standard]",
]
migrate = [
  "alembic",
]
ingest = [
  "minio>=7.2.20",
  "redis>=7.4.0",
  "paramiko>=5.0.0",
  "rq>=2.8.0",
]
worker-ml = [
  "minio>=7.2.20",
  "redis>=7.4.0",
  "rq>=2.8.0",
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "pillow>=12.2.0",
]

[dependency-groups]
dev = [
  "fastapi-cache2>=0.2.2",
  "httpx",
  "jinja2>=3.1.6",
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "redis>=7.4.0",
  "pre-commit",
  "nbformat>=5.10.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = [
  "casbin",
  "casbin_async_sqlalchemy_adapter",
  "hvac",
  "paramiko",
  "PIL",
  "PIL.*",
  "torch",
  "torch.*",
  "torchvision",
  "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "integration: integration tests that use real infrastructure containers",
  "smoke: end-to-end smoke tests that require the full docker-compose stack",
]

[tool.ruff.lint.per-file-ignores]
"app/classifier/model.py" = ["E402"]
"app/classifier/predict.py" = ["E402", "I001"]
"app/classifier/transforms.py" = ["E402"]
