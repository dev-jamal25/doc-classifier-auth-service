services:
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ${POSTGRES_DB:-doc_classifier}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc_user} -d ${POSTGRES_DB:-doc_classifier}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sftp:
    image: atmoz/sftp:latest
    command: "${SFTP_USERNAME:-sftp-user}:${SFTP_PASSWORD:-dev-sftp-password}:::upload"
    ports:
      - "2222:22"

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-prod}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-root-token}
      POSTGRES_USER: ${POSTGRES_USER:-doc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ${POSTGRES_DB:-doc_classifier}
      SFTP_USERNAME: ${SFTP_USERNAME:-sftp-user}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-dev-sftp-password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./backend/scripts/vault_init.sh:/vault_init.sh:ro
    entrypoint: ["/bin/sh", "/vault_init.sh"]
    restart: "no"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-documents-raw}
      MINIO_OVERLAY_BUCKET: ${MINIO_OVERLAY_BUCKET:-documents-overlays}
    volumes:
      - ./backend/scripts/minio_init.sh:/minio_init.sh:ro
    entrypoint: ["/bin/sh", "/minio_init.sh"]
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: docker/migrate.Dockerfile
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-root-token}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_BASE_PATH: ${VAULT_KV_BASE_PATH:-doc-classifier}
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: docker/api.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-root-token}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_BASE_PATH: ${VAULT_KV_BASE_PATH:-doc-classifier}
      MINIO_ENDPOINT: http://minio:9000
      SFTP_HOST: sftp
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
      dockerfile: docker/worker.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-root-token}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_BASE_PATH: ${VAULT_KV_BASE_PATH:-doc-classifier}
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-doc-jobs}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-2}

  sftp-ingest:
    build:
      context: ./backend
      dockerfile: docker/sftp-ingest.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      sftp:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-root-token}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_BASE_PATH: ${VAULT_KV_BASE_PATH:-doc-classifier}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-documents-raw}
      MINIO_OVERLAY_BUCKET: ${MINIO_OVERLAY_BUCKET:-documents-overlays}
      SFTP_HOST: sftp
      SFTP_PORT: "22"
      SFTP_REMOTE_DIR: ${SFTP_REMOTE_DIR:-/upload}
      SFTP_QUARANTINE_DIR: ${SFTP_QUARANTINE_DIR:-/quarantine}
      SFTP_POLL_INTERVAL_SECONDS: ${SFTP_POLL_INTERVAL_SECONDS:-5}
      MAX_SFTP_FILE_SIZE_BYTES: ${MAX_SFTP_FILE_SIZE_BYTES:-52428800}
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-doc-jobs}

  # frontend:
  #   # TODO: choose framework (React vs Streamlit) before enabling.
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
